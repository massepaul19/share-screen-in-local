<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ESTLC SHARE SCREEN - Session</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="static/styles/style.css">
  <link rel="stylesheet" href="static/styles/style_chat.css">
  <link rel="stylesheet" href="static/styles/style_notes.css">
  <link rel="stylesheet" href="static/styles/style_participants.css">
  <link rel="stylesheet" href="static/styles/style_modals.css">
  <link rel="stylesheet" href="static/styles/emoji.css">
  <link rel="stylesheet" href="static/styles/responsive.css">
</head>
<body class="room-page">

  <!-- TOP BAR -->
  <header class="room-header">
    <div class="room-header-left">
      <div class="brand-logo small">
        <img src="static/images/logo.png" alt="ESTLC" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span style="display:none">ES</span>
      </div>
      <div class="room-info">
        <span class="room-id" id="roomIdDisplay">12345</span>
        <div class="room-meta">
          <span><i class="fa-solid fa-users"></i> <span id="participantCount">0</span> participant(s)</span>
          <span class="share-badge" id="shareBadge" style="display:none">
            <i class="fa-solid fa-display"></i> <span>Partage actif</span>
          </span>
        </div>
      </div>
    </div>
    <div class="room-header-right">
      <button class="btn-icon" id="btnSettings" title="Paramètres">
        <i class="fa-solid fa-gear"></i>
      </button>
      <button class="btn-header-tab" id="btnParticipants" title="Participants">
        <i class="fa-solid fa-users"></i>
        <span>Participants</span>
      </button>
      <button class="btn-header-tab" id="btnNotes" title="Notes">
        <i class="fa-solid fa-pen-to-square"></i>
        <span>Notes</span>
      </button>
      <button class="btn-header-tab" id="btnChat" title="Chat">
        <i class="fa-regular fa-comment"></i>
        <span>Chat</span>
      </button>
    </div>
  </header>

  <!-- MAIN ROOM LAYOUT -->
  <div class="room-layout" id="roomLayout">

    <!-- VIDEO AREA -->
    <div class="video-area" id="videoArea">

      <!-- SCREEN SHARE (main) -->
      <div class="screen-share-container" id="screenShareContainer">
        <div class="screen-share-label">
          <div class="screen-share-avatar">
            <i class="fa-solid fa-display"></i>
          </div>
          <div>
            <strong id="sharerName">Personne</strong>
            <span class="live-badge">● En direct</span>
          </div>
        </div>
        <button class="expand-btn" id="expandBtn" title="Plein écran">
          <i class="fa-solid fa-expand"></i>
        </button>
        <div class="screen-placeholder" id="screenPlaceholder">
          <i class="fa-solid fa-display"></i>
          <p>Bienvenue dans <strong>ESTLC SHARING SCREEN</strong><br>En attente du partage...</p>
        </div>
        <video id="screenVideo" autoplay playsinline style="display:none; width:100%; height:100%; object-fit:contain;"></video>
      </div>

    </div>

    <!-- SIDE PANEL — Participants & Chat -->
    <div class="side-panel" id="sidePanel">

      <!-- PARTICIPANTS PANEL -->
      <div class="panel-content" id="participantsPanel">
        <div class="panel-header">
          <i class="fa-solid fa-users"></i>
          <h3>Participants</h3>
          <span class="participant-count-badge" id="sideParticipantCount">0</span>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" id="btnViewList"><i class="fa-solid fa-list"></i> Liste</button>
          <button class="view-btn" id="btnViewGrid"><i class="fa-solid fa-border-all"></i> Grille</button>
        </div>
        <div class="participants-list" id="participantsList">
          <!-- Dynamique -->
        </div>
      </div>

      <!-- CHAT PANEL -->
      <div class="panel-content hidden" id="chatPanel">
        <div class="panel-header">
          <i class="fa-regular fa-comment"></i>
          <h3>Chat</h3>
          <span class="msg-count" id="msgCount">0</span>
        </div>

        <!-- Onglets de navigation -->
        <div class="chat-tabs" id="chatTabs">
          <button class="chat-tab active" id="tabPublic">Général</button>
          <button class="chat-tab" id="tabPrivate" style="display:none;">Privé <span id="privateBadge" class="badge"></span></button>
        </div>

        <div class="chat-messages" id="chatMessages">
          <!-- Messages dynamiques -->
        </div>

        <!-- Conteneur Chat Privé -->
        <div class="private-chat-container hidden" id="privateChatContainer">
          <div id="privateChatList" class="private-chat-list">
            <div class="chat-welcome"><p>Aucune conversation privée.</p></div>
          </div>
          <div id="privateChatView" class="private-chat-view hidden">
            <!-- Géré par JS -->
          </div>
        </div>

        <div class="chat-input-container">
          <input type="file" id="fileInput" style="display: none;">
          <button class="attach-btn" title="Joindre un fichier"><i class="fa-solid fa-paperclip"></i></button>
          <div class="chat-input-wrapper" id="chatInputWrapper">
            <textarea id="chatInput" placeholder="Envoyer un message..." rows="1"></textarea>
          </div>
          <!-- Bouton emoji inséré ici par emoji.js -->
          <button class="send-btn" id="sendBtn" title="Envoyer"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>

      <!-- Placeholder vide (non utilisé visuellement) -->
      <div class="panel-content hidden" id="chatPanelContainer"></div>

    </div>

  </div>

  <!-- BOTTOM CONTROLS -->
  <footer class="room-footer">
    <div class="controls-bar">
      <button class="ctrl-btn" id="btnMic" title="Couper le micro">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button class="ctrl-btn" id="btnCam" title="Couper la caméra">
        <i class="fa-solid fa-video"></i>
      </button>
      <button class="ctrl-btn" id="btnMuteAll" title="Couper tous les micros" style="display:none;">
        <i class="fa-solid fa-microphone-slash"></i>
      </button>
      <button class="ctrl-btn" id="btnUnmuteAll" title="Réactiver tous les micros" style="display:none;">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button class="ctrl-btn" id="btnScreen" title="Partager l'écran">
        <i class="fa-solid fa-display"></i>
      </button>
      <button class="ctrl-btn" id="btnContentShare" title="Partager un contenu">
        <i class="fa-solid fa-photo-film"></i>
      </button>
      <button class="ctrl-btn" id="btnRequest" title="Demander à partager" style="display: none;">
        <i class="fa-solid fa-hand"></i>
      </button>
      <button class="ctrl-btn" id="btnRaiseHand" title="Lever la main">
        <i class="fa-regular fa-hand-paper"></i>
      </button>
      <button class="ctrl-btn" id="btnSpeaker" title="Couper le son">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <div class="react-wrapper">
        <button class="ctrl-btn" id="btnReact" title="Réagir">
          <i class="fa-regular fa-face-smile"></i>
        </button>
        <div class="reactions-picker"></div>
      </div>
      <button class="ctrl-btn danger" id="btnHangup" title="Raccrocher">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
    </div>
  </footer>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content settings-modal">
      <div class="modal-header">
        <h3>Paramètres</h3>
        <button class="close-modal-btn" id="closeSettingsBtn">✕</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>Apparence</label>
          <div class="setting-item">
            <span>Mode Sombre</span>
            <label class="switch">
              <input type="checkbox" id="darkModeToggle">
              <span class="slider round"></span>
            </label>
          </div>
        </div>
        <div class="setting-group">
          <label>Notifications</label>
          <div class="setting-item">
            <span>Sons de notification</span>
            <label class="switch">
              <input type="checkbox" id="soundToggle" checked>
              <span class="slider round"></span>
            </label>
          </div>
        </div>
        <div class="setting-group">
          <label>Profil</label>
          <div class="setting-item-col">
            <span>Nom d'affichage</span>
            <div class="input-group" style="display:flex;gap:8px;align-items:center;width:100%;">
              <input type="text" id="settingsNameInput" placeholder="Votre nom" style="flex:1;min-width:0;">
              <button id="saveNameBtn" class="btn-primary small" style="flex-shrink:0;white-space:nowrap;">Enregistrer</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="static/js/chat.js"></script>
  <script src="static/js/private-chat.js"></script>
  <script src="static/js/emoji.js"></script>
  <script src="static/js/notes-manager.js"></script>
  <script src="static/js/shareRequestManager.js"></script>
  <script src="static/js/content-share-manager.js"></script>
  <script src="static/js/app.js"></script>
  <script src="static/js/participant-admin.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sidePanel = document.getElementById('sidePanel');
      const isMobile = () => window.innerWidth <= 768;

      // ===== GESTION DU PANNEAU LATÉRAL =====
      function showPanel(panelName) {
        const panelEl = document.getElementById(panelName + 'Panel');
        const btnEl   = document.getElementById('btn' + panelName.charAt(0).toUpperCase() + panelName.slice(1));

        // Toggle : si déjà actif + ouvert → on ferme
        if (btnEl && btnEl.classList.contains('active') && sidePanel.classList.contains('open')) {
          closeSidePanel();
          return;
        }

        // Masquer tous les panels et désactiver tous les boutons
        document.querySelectorAll('.panel-content').forEach(p => p.classList.add('hidden'));
        document.querySelectorAll('.btn-header-tab').forEach(b => b.classList.remove('active'));

        // Afficher le panel demandé
        if (panelEl) panelEl.classList.remove('hidden');
        if (btnEl)   btnEl.classList.add('active');

        sidePanel.classList.add('open');
      }

      function closeSidePanel() {
        sidePanel.classList.remove('open');
        document.querySelectorAll('.btn-header-tab').forEach(b => b.classList.remove('active'));
      }

      // ===== SWIPE POUR FERMER LE PANNEAU (mobile) =====
      let touchStartY = 0;
      let touchCurrentY = 0;
      let isDragging = false;

      sidePanel.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
        isDragging = true;
      }, { passive: true });

      sidePanel.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        touchCurrentY = e.touches[0].clientY;
        const deltaY = touchCurrentY - touchStartY;
        if (deltaY > 0) {
          // Glisse vers le bas
          sidePanel.style.transform = `translateY(${deltaY}px)`;
        }
      }, { passive: true });

      sidePanel.addEventListener('touchend', () => {
        isDragging = false;
        const deltaY = touchCurrentY - touchStartY;
        if (deltaY > 80) {
          // Seuil dépassé → fermeture
          closeSidePanel();
        }
        // Réinitialiser le transform inline (la transition CSS reprend)
        sidePanel.style.transform = '';
        touchStartY = 0;
        touchCurrentY = 0;
      });

      // ===== PLEIN ÉCRAN =====
      function toggleFullscreen() {
        const container = document.getElementById('screenShareContainer');
        if (!document.fullscreenElement) {
          container?.requestFullscreen().catch(err => {
            console.warn('Plein écran refusé :', err.message);
          });
        } else {
          document.exitFullscreen?.();
        }
      }

      // ===== LISTENERS =====
      document.getElementById('btnParticipants')?.addEventListener('click', () => showPanel('participants'));
      document.getElementById('btnChat')?.addEventListener('click', () => showPanel('chat'));
      document.getElementById('expandBtn')?.addEventListener('click', toggleFullscreen);

      document.getElementById('btnHangup')?.addEventListener('click', () => {
        if (confirm('Voulez-vous vraiment quitter la session ?')) {
          window.location.href = 'index.html';
        }
      });

      // Fermer le panneau en tapant en dehors (mobile)
      document.getElementById('videoArea')?.addEventListener('click', () => {
        if (isMobile() && sidePanel.classList.contains('open')) {
          closeSidePanel();
        }
      });

      // ===== EMOJI =====
      const chatInput = document.getElementById('chatInput');
      const sendBtn   = document.getElementById('sendBtn');
      if (chatInput && sendBtn && typeof EmojiManager !== 'undefined') {
        new EmojiManager(chatInput, sendBtn);
      }

      // ===== ÉTAT INITIAL =====
      if (!isMobile()) {
        // Bureau : ouvrir participants par défaut
        showPanel('participants');
      }
      // Mobile : panneau fermé par défaut (utilisateur ouvre lui-même)

      // ===== FULLSCREEN CHANGE =====
      document.addEventListener('fullscreenchange', () => {
        const container = document.getElementById('screenShareContainer');
        const icon = document.querySelector('#expandBtn i');
        if (document.fullscreenElement) {
          container?.classList.add('fullscreen');
          if (icon) icon.className = 'fa-solid fa-compress';
        } else {
          container?.classList.remove('fullscreen');
          if (icon) icon.className = 'fa-solid fa-expand';
        }
      });

      // ===== PARAMÈTRES =====
      const settingsModal    = document.getElementById('settingsModal');
      const darkModeToggle   = document.getElementById('darkModeToggle');
      const settingsNameInput = document.getElementById('settingsNameInput');

      document.getElementById('btnSettings')?.addEventListener('click', () => {
        const params = new URLSearchParams(window.location.search);
        const currentName = (window.chatManager?.userName) || params.get('name') || '';
        if (settingsNameInput) settingsNameInput.value = currentName;
        settingsModal.style.display = 'flex';
      });

      document.getElementById('closeSettingsBtn')?.addEventListener('click', () => {
        settingsModal.style.display = 'none';
      });

      window.addEventListener('click', (e) => {
        if (e.target === settingsModal) settingsModal.style.display = 'none';
      });

      // Thème persistant
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        if (darkModeToggle) darkModeToggle.checked = true;
      }

      darkModeToggle?.addEventListener('change', (e) => {
        if (e.target.checked) {
          document.body.classList.add('dark-mode');
          localStorage.setItem('theme', 'dark');
        } else {
          document.body.classList.remove('dark-mode');
          localStorage.setItem('theme', 'light');
        }
      });

      document.getElementById('saveNameBtn')?.addEventListener('click', () => {
        const newName = settingsNameInput?.value.trim();
        if (newName && window.socket) {
          window.socket.emit('update-name', { name: newName });
          if (window.chatManager) window.chatManager.setUserName(newName);
          alert('Nom mis à jour !');
          settingsModal.style.display = 'none';
        }
      });

      // Exposer closeSidePanel pour usage externe si besoin
      window.closeSidePanel = closeSidePanel;
      window.showPanel = showPanel;

      // ===== MUTE ALL / UNMUTE ALL (hôte uniquement) =====
      // Les boutons sont cachés par défaut, montrés quand l'hôte partage
      document.getElementById('btnMuteAll')?.addEventListener('click', () => {
        if (window.socket) {
          window.socket.emit('mute-all');
        }
      });
      document.getElementById('btnUnmuteAll')?.addEventListener('click', () => {
        if (window.socket) {
          window.socket.emit('unmute-all');
        }
      });

      // Exposer une fonction pour afficher/cacher les boutons hôte
      // IMPORTANT : cette définition est la dernière — elle intègre TOUTE la logique
      // (state.isAdmin, ContentShareManager, boutons muteAll)
      window.setHostControls = function(isHost) {
        // Mettre à jour l'état global (utilisé par app.js)
        if (window.state) window.state.isAdmin = isHost;
        // Notifier le ContentShareManager (sinon isHost reste false → pas de broadcast)
        if (window.contentShareManager) window.contentShareManager.setHost(isHost);
        // Afficher / masquer les boutons de modération hôte
        const muteAll   = document.getElementById('btnMuteAll');
        const unmuteAll = document.getElementById('btnUnmuteAll');
        if (muteAll)   muteAll.style.display   = isHost ? 'flex' : 'none';
        if (unmuteAll) unmuteAll.style.display  = isHost ? 'flex' : 'none';
      };

      // ===== ALERTES SALLE =====
      if (window.socket) {
        window.socket.on('room-closing-soon', (data) => {
          // Bannière d'alerte 2 min avant fermeture
          const banner = document.createElement('div');
          banner.id = 'roomClosingBanner';
          banner.style.cssText = `
            position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
            background:#f59e0b;color:#1a1a1a;padding:12px 20px;border-radius:10px;
            z-index:9999;font-weight:600;font-size:14px;
            box-shadow:0 4px 20px rgba(0,0,0,0.3);display:flex;gap:10px;align-items:center;
          `;
          banner.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${data.message}`;
          document.body.appendChild(banner);
          setTimeout(() => banner?.remove(), 30000);
        });

        window.socket.on('room-destroyed', (data) => {
          alert(data.message + '\n\nVous allez être redirigé vers l\'accueil.');
          window.location.href = 'index.html';
        });

        window.socket.on('mute-all-done', (data) => {
          // Confirmation à l'hôte
          const el = document.createElement('div');
          el.style.cssText = `
            position:fixed;top:80px;left:50%;transform:translateX(-50%);
            background:#1e293b;color:white;padding:10px 18px;border-radius:8px;
            z-index:9999;font-size:13px;font-weight:500;
          `;
          el.textContent = '🔇 ' + data.message;
          document.body.appendChild(el);
          setTimeout(() => el?.remove(), 3000);
        });
      }
    });
  </script>
</body>
</html>
